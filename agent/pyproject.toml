[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weft-agent"
version = "0.1.0"
description = "Weft agent service — LLM tasks + graph-constrained governance agent (ADR-0012)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "langgraph>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weft-agent = "weft_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["weft_agent*"]
